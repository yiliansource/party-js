name: CI

on:
    push:
        branches: [v3]
    pull_request:
        branches: [v3]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        outputs:
            library: ${{ steps.filter.outputs.library }}
            docs: ${{ steps.filter.outputs.docs }}
        steps:
            - uses: actions/checkout@v7
            - uses: dorny/paths-filter@v4
              id: filter
              with:
                  filters: |
                      shared: &shared
                          - package.json
                          - bun.lock
                          - tsconfig.json
                          - .github/workflows/ci.yml
                      library:
                          - *shared
                          - src/**
                          - tests/**
                          - tsup.config.ts
                      docs:
                          - *shared
                          - src/**
                          - docs/**

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - run: bun run lint

    library:
        needs: changes
        if: needs.changes.outputs.library == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - run: bun run typecheck
            - run: bun run test
            - run: bun run build

    docs:
        needs: changes
        if: needs.changes.outputs.docs == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - run: bun install --frozen-lockfile --cwd docs
            - run: bun run --cwd docs check
            - run: bun run --cwd docs build
            - uses: actions/upload-artifact@v7
              with:
                  name: docs-dist
                  path: docs/dist

    deploy:
        needs: [library, docs]
        if: >-
            !cancelled()
            && github.event_name != 'pull_request'
            && needs.docs.result == 'success'
            && (needs.library.result == 'success' || needs.library.result == 'skipped')
        runs-on: ubuntu-latest
        permissions:
            contents: read
            deployments: write
        steps:
            - uses: actions/download-artifact@v8
              with:
                  name: docs-dist
                  path: docs/dist
            - uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: pages deploy docs/dist --project-name=party-js-v3
                  gitHubToken: ${{ secrets.GITHUB_TOKEN }}
