name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        outputs:
            library: ${{ steps.filter.outputs.library }}
            docs: ${{ steps.filter.outputs.docs }}
        steps:
            - uses: actions/checkout@v7
            - uses: dorny/paths-filter@v4
              id: filter
              with:
                  filters: |
                      shared: &shared
                          - package.json
                          - bun.lock
                          - tsconfig.json
                          - .github/workflows/ci.yml
                      library:
                          - *shared
                          - src/**
                          - tests/**
                          - scripts/**
                          - tsup.config.ts
                      docs:
                          - *shared
                          - src/**
                          - docs/**
                          - CHANGELOG.md

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - run: bun run lint

    library:
        needs: changes
        if: needs.changes.outputs.library == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - run: bun run typecheck
            - run: bun run test
            - run: bun run build
            - run: bun run size
            - run: bun run api

    docs:
        needs: changes
        if: needs.changes.outputs.docs == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - run: bun install --frozen-lockfile --cwd docs
            - run: bun run --cwd docs test
            - run: bun run --cwd docs check
            - run: bun run --cwd docs build
            - uses: actions/upload-pages-artifact@v5
              if: github.event_name != 'pull_request'
              with:
                  path: docs/dist

    deploy:
        needs: [library, docs]
        if: >-
            !cancelled()
            && github.event_name != 'pull_request'
            && needs.docs.result == 'success'
            && (needs.library.result == 'success' || needs.library.result == 'skipped')
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        concurrency:
            group: pages
            cancel-in-progress: false
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5
