output:
    - summary
    - failure

pre-commit:
    parallel: true
    commands:
        biome:
            glob: "*.{ts,json}"
            run: bunx biome check --staged --no-errors-on-unmatched

pre-push:
    parallel: true
    commands:
        typecheck:
            run: bun run typecheck
        test:
            run: bun run test
        astro-check:
            glob: "{docs,src}/**/*"
            run: bun run --cwd docs check
